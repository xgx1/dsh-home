ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: max
permission:
  defaultPreset: workspace-write
agent-loop:
  maxParallelToolCalls: 10
agent-presets:
  default: omni
llm-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY
  baseURL: http://127.0.0.1:8787/v1
  thinking: enabled
  reasoningEffort: max
  models:
    - id: deepseek-flash
      name: DeepSeek-V41-Flash
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
      systemPromptUpdate: in-history
shell:
  timeoutMs: 1800000
locale:
  preference: zh
llm-pi-ai:
  providers:
    {
      md:
        {
          apiKeyEnv: MD_API_KEY,
          api: openai-completions,
          baseURL: https://api-inference.modelscope.cn/v1,
          models:
            [
              {
                  id: deepseek-ai/DeepSeek-V4.1-Flash,
                  name: deepseek-ai/DeepSeek-V4.1-Flash,
                  contextWindow: 1000000,
                  maxTokens: 256000
                }
            ]
        },
      local-bonsai:
        {
          displayName: "Bonsai 2 27B (local)",
          api: openai-completions,
          baseURL: "http://127.0.0.1:8081/v1",
          headers: { Authorization: "Bearer local-no-auth" },
          reasoning: medium,
          models:
            [
              {
                  id: bonsai2-27b,
                  name: "Bonsai 2 27B (local AMD)",
                  contextWindow: 102400,
                  maxTokens: 32768,
                  reasoningEfforts: { "off": none, low: low, medium: medium, xhigh: xhigh }
                }
            ]
        },
      sensenova:
        {
          displayName: "SenseNova token plan (headroom :8788)",
          apiKeyEnv: SENSENOVA_API_KEY,
          api: openai-completions,
          baseURL: "http://127.0.0.1:8788/v1",
          compat: { supportsDeveloperRole: false },
          models:
            [
              {
                  id: sensenova-6.8-flash-lite,
                  name: "SenseNova 6.8 Flash-Lite",
                  contextWindow: 262144,
                  maxTokens: 65536,
                  input: [ text, image ],
                  reasoningEfforts: { "off": none, low: low, medium: medium, high: high, xhigh: xhigh }
                },
              {
                  id: kimi-k3,
                  name: "Kimi K3",
                  contextWindow: 1048576,
                  maxTokens: 65536,
                  # SenseNova reports text-only for kimi-k3, but the model takes
                  # images as base64 data-URLs (public URLs are rejected upstream),
                  # so declare the capability here.
                  input: [ text, image ],
                  # temperature/top_p/frequency_penalty/presence_penalty are fixed
                  # upstream; generation length uses max_completion_tokens, not max_tokens.
                  compat: { maxTokensField: max_completion_tokens },
                  # Kimi K3 always reasons; low/high/max, upstream default max. "off"
                  # has no wire value, so leave the level undeclared.
                  reasoningEfforts: { low: low, high: high, max: max }
                }
            ]
        }
    }
ui-theme:
  fontSize: 17
ui-conversation:
  busyEnter: steer
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: deepseek-official
      model: deepseek-flash
    - provider: md
      model: deepseek-ai/DeepSeek-V4.1-Flash
    - provider: local-bonsai
      model: bonsai2-27b
    - provider: sensenova
      model: sensenova-6.8-flash-lite
    - provider: sensenova
      model: kimi-k3
subagent:
  maxDepth: 10
  maxActiveSubagents: 20
