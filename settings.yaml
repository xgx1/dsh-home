ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: max
permission:
  defaultPreset: workspace-write
agent-loop:
  maxParallelToolCalls: 10
agent-presets:
  default: omni
llm-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY
  baseURL: http://127.0.0.1:8787/v1
  thinking: enabled
  reasoningEffort: max
  models:
    - id: deepseek-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
      inputModalities:
        - text
context-compression:
  profile: off
  custom:
    version: 3
    unit: tokens
    fresh:
      enabled: true
      trigger: 8192
      target: 3072
    aggregate:
      enabled: true
      trigger: 32768
      target: 12288
    history:
      enabled: true
      trigger: 500000
      keepRecentToolCalls: 10
      keepRecentTokens: 64000
      minReclaim: 96000
    prefixPolicy: pressure-break
    tailTrim:
      enabled: false
      trigger: 700000
shell:
  timeoutMs: 1800000
locale:
  preference: zh
llm-pi-ai:
  providers: {}
