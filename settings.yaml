ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: max
permission:
  defaultPreset: workspace-write
agent-loop:
  maxParallelToolCalls: 10
agent-presets:
  default: omni
llm-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY
  baseURL: http://127.0.0.1:8787/v1
  thinking: enabled
  reasoningEffort: max
  models:
    - id: deepseek-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
      inputModalities:
        - text
shell:
  timeoutMs: 1800000
locale:
  preference: zh
llm-pi-ai:
  providers: {}
ui-theme:
  fontSize: 17
ui-conversation:
  busyEnter: steer
