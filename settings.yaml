ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  # 2026-09-30 用户指示：默认模型仍是 deepseek-official 的 flash，档位从 max 收到 low
  reasoningEffort: low
permission:
  defaultPreset: workspace-write
agent-loop:
  maxParallelToolCalls: 10
agent-presets:
  default: omni
llm-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY
  # 直连 DeepSeek 官方：原经 headroom :8787 中转，该层已拆除；去掉 baseURL 覆盖
  # 即回落插件默认 https://api.deepseek.com。
  # protocol 保持 chat-completions —— 这行当年是为绕 headroom 只放行
  # /v1/chat/completions（messages 会 403，被 DSH 归类成 AUTH、UI 显示“API 密钥
  # 无效”，并非 key 问题）才写的；直连后换插件默认的 messages 属未经实测的变量，
  # 要试另起一次。
  protocol: chat-completions
  thinking: enabled
  reasoningEffort: low
  models:
    - id: deepseek-flash
      name: DeepSeek-V41-Flash
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
      systemPromptUpdate: in-history
shell:
  timeoutMs: 1800000
locale:
  preference: zh
llm-pi-ai:
  providers:
    {
      md:
        {
          apiKeyEnv: MD_API_KEY,
          api: openai-completions,
          baseURL: https://api-inference.modelscope.cn/v1,
          models:
            [
              {
                  id: deepseek-ai/DeepSeek-V4.1-Flash,
                  name: deepseek-ai/DeepSeek-V4.1-Flash,
                  contextWindow: 1000000,
                  maxTokens: 256000
                }
            ]
        },
      local-bonsai:
        {
          displayName: "Bonsai 2 27B (local)",
          api: openai-completions,
          baseURL: "http://127.0.0.1:8081/v1",
          headers: { Authorization: "Bearer local-no-auth" },
          reasoning: medium,
          models:
            [
              {
                  id: bonsai2-27b,
                  name: "Bonsai 2 27B (local AMD)",
                  contextWindow: 102400,
                  maxTokens: 32768,
                  reasoningEfforts: { "off": none, low: low, medium: medium, xhigh: xhigh }
                }
            ]
        },
      sensenova:
        {
          # OpenAI Responses 全兼容端点（原经 headroom :8788 走 chat/completions）。
          # 2026-09-30 实测：developer 角色、none/low/medium/high/xhigh 五档 effort、
          # strict 工具、SSE 流（response.* 事件）全部 200。
          # 注意：该网关是严格 schema，拒 pi-ai 必发的 reasoning.summary；由
          # billion-context 的 compat.dropFields 在转发边界删除（见 ADR-0009）。
          displayName: "SenseNova token plan (Responses API)",
          apiKeyEnv: SENSENOVA_API_KEY,
          api: openai-responses,
          baseURL: "https://token.sensenova.cn/v1",
          reasoning: xhigh,
          compat:
            {
              supportsDeveloperRole: true,
              supportsMaxOutputTokens: true,
              supportsStrictMode: true
            },
          models:
            [
              {
                  # 官方映射表：DeepSeek V4.1 Flash 的 model id 就是 deepseek-flash
                  # （写成 deepseek-v4.1-flash 会 403「not available in the current
                  # token plan」——那个 id 不在套餐里）。
                  id: deepseek-flash,
                  name: DeepSeek V4.1 Flash,
                  contextWindow: 1000000,
                  maxTokens: 65536,
                  input: [ text, image ],
                  reasoningEfforts: { off: none, low: low, medium: medium, high: high, xhigh: xhigh }
                },
              {
                  id: sensenova-6.8-flash-lite,
                  name: sensenova-6.8-flash-lite,
                  contextWindow: 262144,
                  maxTokens: 65536,
                  input: [ text, image ],
                  reasoningEfforts: { off: none, low: low, medium: medium, high: high, xhigh: xhigh }
                }
            ]
        },
      step:
        {
          # 直连 StepFun（原经 headroom :8789 中转）。headroom 在上游地址后追加
        # /v1/chat/completions，故这里补成 /step_plan/v1。
        # 思考强度只有 low/medium/high —— Step Plan 没有 off/none，也没有
        # xhigh/max，所以 reasoningEfforts 只声明这三档；不声明的档位
        # thinkingLevelMap 为 null，选择器里自动隐藏。
          displayName: "StepFun Step Plan",
          apiKeyEnv: STEP_API_KEY,
          api: openai-completions,
          baseURL: "https://api.stepfun.com/step_plan/v1",
          reasoning: medium,
          compat:
            {
              # pi-ai 对未识别的 baseURL 默认发 max_completion_tokens，StepFun
            # 只认 max_tokens；不覆盖会 400。
              supportsReasoningEffort: true,
              supportsDeveloperRole: false,
              maxTokensField: max_tokens
            },
          # 只挂 step-5-preview（StepFun 新一代旗舰基模，2026-09-20 起 preview）：
        # 1M tokens 上下文与最大输出，文本/图片/视频输入，编程与 Agent 场景。
        # step-router-v1 是按请求在 deepseek-v4-pro 与 flash 系列间切换的路由，
        # 不透明；step-3.7-flash / step-3.5 系列是旧代，均不上。
        # 模型支持视频输入，但 DSH 的 modality gate 只有 text/image，视频走不通。
          models:
            [
              {
                  id: step-5-preview,
                  name: step-5-preview,
                  contextWindow: 1000000,
                  # 文档写明 max_tokens 默认 INF、由模型自决；这里给 128K 作上界，
                # 单条回复用不到，纯为兜住失控输出吃掉套餐 Credit。
                  maxTokens: 131072,
                  input: [ text, image ],
                  reasoningEfforts: { low: low, medium: medium, high: high }
                }
            ]
        }
    }
ui-theme:
  fontSize: 17
ui-conversation:
  busyEnter: steer
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: md
      model: deepseek-ai/DeepSeek-V4.1-Flash
    - provider: local-bonsai
      model: bonsai2-27b
    - provider: sensenova
      model: sensenova-6.8-flash-lite
    - provider: sensenova
      model: deepseek-flash
subagent:
  maxDepth: 10
  maxActiveSubagents: 20
ui-chat:
  transcriptView: normal
