# ══════════════════════════════════════════════════════════════════════════
#  ~/.dsh/cordis.patch.yml — home 级 user patch 层（对所有 profile 生效）
#  与 profiles/<名>/cordis.patch.yml 一样属于 user patch 层：热重载，改完即生效。
# ══════════════════════════════════════════════════════════════════════════

# ── 用户要求（2026-10-01）：ponytail 常驻（caveman 已于 2026-10-26 随技能删除）──
# 目标：技能默认启用、以最高等级运行，不必等模型自己想起来调用技能。
# 手段：挂 DSH 自带的 Claude Code hooks 桥，在会话开头把规则集作为上下文注入：
#   SessionStart     → ponytail-activate.js
#   UserPromptSubmit → ponytail mode tracker（让 /ponytail lite、/ponytail full 生效）
# caveman 的两个钩子 2026-11-24 已从 skill-context-hooks.json / dsh-skill-hooks.mjs 里
# 移除：技能分组仓 2026-10-26 删掉后就一直在报 Cannot find module，每轮提示都白跑
# 一次（exitCode 1）。要恢复先 clone 回该技能分组，再加回钩子行。
# 钩子清单在 ~/.dsh/hooks/skill-context-hooks.json（属于本仓，随仓库跨设备走）。
#
# 为什么命令串里内联 env，而不是配置字段：
#   · PLUGIN_DATA —— ponytail 的方言开关。只有它存在时 ponytail 才输出
#     {"hookSpecificOutput":{"additionalContext":…}} 这种 JSON；否则走原生 Claude
#     分支写纯 stdout，而 DSH 桥的 codec（hook-protocol/src/codec.ts:59
#     parseHookOutput）只认 exit 0 且首字符为 { 的 JSON，纯 stdout 一律忽略。
#   · PONYTAIL_DEFAULT_MODE=ultra —— 固定最高等级。
#     （等级状态文件写在沙箱外会被静默拒绝，所以默认值必须从 env 给，不能靠落盘。）
#   · 桥没有「传任意 env」的配置字段，只能在命令串里内联。
# ~/.dsh/hooks/caveman-session-context.js 是 caveman 时代的 shim，现在没有任何
# 钩子引用它（caveman 技能删除后失去意义），文件留着仅作参考。
#
# 前置条件（换设备重建时）：
#   1. dsh-extensions 里技能分组仓已 checkout（submodule）：
#      skills/dietrichgebert-ponytail
#   2. 技能软链已建：cd dsh-extensions && ./install-skill.sh
#   3. node 在 dsh-web 的 PATH 上（桥用 bash -c 起钩子）
# 依赖解析：@deepseek-ai/dsh-hooks-claude-code 由启动器 app 声明
# （apps/cli/package.json），从 apps/cli 的解析链加载，不用装进 profile。
[[entry]]
[[entry.insert]]
id = "hooks-claude-code"
name = "@deepseek-ai/dsh-hooks-claude-code"

[entry.insert.config]
        # 跨平台：用 dshHomePath() 在运行时解析，避免把 C:/... 或 /home/... 写死。
configPath = "js:dshHomePath('hooks', 'skill-context-hooks.json')"
        # ${CLAUDE_PLUGIN_ROOT} 的替换值，供 skill-context-hooks.json 里的命令定位分发器。
pluginRoot = "js:dshHomePath('hooks')"
