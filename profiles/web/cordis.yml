- id: dsh-task-manager
  name: dsh-task-manager
- id: dsh-sidebar-taskbar
  name: dsh-sidebar-taskbar
- id: agent-team
  name: '@deepseek-ai/dsh-experimental-agent-team'
  config:
    maxMembers: 8
    maxTasks: 256
    maxMessageBytes: 65536
    disposalTimeoutMs: 5000
- id: tool-agent-team
  name: '@deepseek-ai/dsh-experimental-tool-agent-team'
  config:
    freshProvider: spawn
    forkProvider: fork
- id: ui-agent-team
  name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
- id: llm-retry-schedule
  name: dsh-llm-retry-schedule
  config:
    maxRetries: 1000
    schedule:
      - fromRetry: 1
        delayMs: 5000
      - fromRetry: 5
        delayMs: 10000
      - fromRetry: 20
        delayMs: 60000
- id: bili-native
  name: billion-context/dsh
- id: openviking-memory-runtime
  name: '@openviking/dsh-memory-plugin'
- id: dsh-ops-shell
  name: dsh-ops/shell
  disabled: false
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    bashPath: /usr/bin/bash
    configUpdateVersion: 1
- id: dsh-ops-file
  name: dsh-ops/file
  config:
    promptPolicy: true
    enableShellTools: false
    required: false
    toolCallTimeoutMs: 300000
    configUpdateVersion: 1
- id: dsh-ops-background
  name: dsh-ops/background
  disabled: false
  config:
    promptPolicy: true
    enableShellTools: true
    required: false
    toolCallTimeoutMs: 300000
    bashPath: /usr/bin/bash
    configUpdateVersion: 1
- id: dsh-ops-ptc
  name: dsh-ops/ptc
  disabled: false
  config:
    required: false
- id: mcp-cbm
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: cbm
    transport: stdio
    command: codebase-memory-mcp
    args:
      - '--ui=true'
      - '--port=9749'
- id: mcp-ue
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: ue
    transport: streamable-http
    reconnect:
      maxAttempts: 215
    url: http://127.0.0.1:8000/mcp
    failOnStartupError: false
- id: browser-use
  name: '@deepseek-ai/dsh-browser-use'
- id: browser-use-playwright
  name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
  config:
    mode: attach
    endpoint: http://127.0.0.1:9222
    exclusive: false
- id: computer-use
  name: '@deepseek-ai/dsh-computer-use'
- id: computer-use-cua-native
  name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
- id: bash-local
  name: '@deepseek-ai/dsh-bash-local'
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
- id: web-search-exa
  name: '@deepseek-ai/dsh-web-search-exa'
- id: mcp-zvecgrep
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: zvecgrep
    transport: stdio
    command: /home/sx/.dsh/bin/zg-autoidx.mjs
    args:
      - server
      - '--stdio'
      - '--mcp-toolset'
      - full
- id: session-manager
  name: '@deepseek-ai/dsh-session-manager'
  config:
    managerPreset: management
    workerPresets:
      - standard
    maxMessageBytes: 16384
    questionWaitSeconds: 1
- id: preset-management
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: management
    name: 管理模式
    description: 仅管理用户交接或自行创建的普通工作对话，不直接执行任务。
    order: 9
    plugins: []
