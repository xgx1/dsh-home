    freshProvider: spawn
    forkProvider: fork
- id: ui-agent-team
  name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
- id: llm-retry-schedule
  name: dsh-llm-retry-schedule
  config:
    maxRetries: 60
    retryableCodes:
      - EMPTY_RESPONSE
      - RATE_LIMIT
      - SERVER
      - TIMEOUT
      - TRANSPORT
    schedule:
      - fromRetry: 1
        delayMs: 5000
      - fromRetry: 5
        delayMs: 10000
      - fromRetry: 20
        delayMs: 60000
- id: bili-native
  name: billion-context/dsh
- id: dsh-dracula-theme
  name: dsh-dracula-theme
- id: openviking-memory-runtime
  name: '@openviking/dsh-memory-plugin'
- id: dsh-perf-mode
  name: dsh-perf-mode
- id: dsh-ops-shell
  name: dsh-ops/shell
  disabled: false
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    bashPath: /usr/bin/bash
    extraGuidance: >-
      文件与检索路由（本部署的文件工具面只有宿主的 read/write/edit/read_image + zvecgrep）：

      - 新建或整篇覆盖 → write；改一处精确文本或清点 → edit；看内容先 read。

      - 穷尽精确检索（字面、正则、文件名）→ zvec_grep_rg（真 ripgrep，尊重 .gitignore）。

      - 语义/跨文件理解类检索 → zvec_grep_search（要求该工作区已建索引；未建会报
      WORKSPACE_INDEX_NOT_FOUND）。

      - 裸 grep / glob 在本部署不存在；不要找它们，也不要改用 shell 里的 grep 绕开。
    configUpdateVersion: 1
- id: dsh-ops-file
  name: dsh-ops/file
  disabled: true
  config:
    promptPolicy: true
    enableShellTools: false
    required: false
    toolCallTimeoutMs: 300000
- id: dsh-ops-background
  name: dsh-ops/background
  disabled: false
  config:
    promptPolicy: true
    enableShellTools: true
    required: false
    toolCallTimeoutMs: 300000
    bashPath: /usr/bin/bash
    configUpdateVersion: 1
- id: dsh-ops-ptc
  name: dsh-ops/ptc
  disabled: false
  config:
    required: false
- id: dsh-blender-plugin
  name: '@dsh-external/dsh-blender-plugin'
  disabled: true
  config: {}
- id: ego-browser
  name: dsh-ego-browser
  config:
    egoBin: /home/sx/.local/share/ego-lite-runtime/bin/ego-shared.mjs
    idleTimeoutMin: 0
    chromePath: /opt/helium-browser-bin/helium
    chromeArgs: >-
      --load-extension=/usr/local/share/browser-themes/dracula
      --enable-features=VerticalTabs,VaapiVideoDecoder,VaapiIgnoreDriverChecks
- id: mcp-cbm
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: cbm
    transport: stdio
    command: codebase-memory-mcp
- id: mcp-ue
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: ue
    transport: streamable-http
    reconnect:
      maxAttempts: 215
    url: http://127.0.0.1:8000/mcp
    failOnStartupError: false
- id: mcp-unity
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: unity
    transport: stdio
    command: /home/sx/.local/bin/uvx-no-proxy
    args:
      - '--from'
      - mcpforunityserver==10.3.0
      - mcp-for-unity
      - '--transport'
      - stdio
    toolCallTimeoutMs: 180000
    failOnStartupError: false
- id: browser-use
  name: '@deepseek-ai/dsh-browser-use'
- id: browser-use-playwright
  name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
  disabled: true
  config:
    mode: attach
    endpoint: http://127.0.0.1:9222
    exclusive: false
- id: computer-use
  name: '@deepseek-ai/dsh-computer-use'
- id: computer-use-cua-native
  name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
  disabled: true
- id: bash-local
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 1800000
    maxTimeoutMs: 1800000
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
- id: mcp-zvecgrep
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: zvecgrep
    transport: stdio
    command: zg
    args:
      - server
      - '--stdio'
      - '--mcp-toolset'
      - full
- id: mcp-rea
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: rea
    transport: stdio
    command: rea
    args:
      - mcp
    env:
      GHIDRA_INSTALL_DIR: /opt/ghidra
    toolCallTimeoutMs: 600000
- id: preset-js
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: js
    name: JS 项目
    order: 20
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are a coding agent powered by the {{model}} model, running on
            the DeepSeek Harness.

            You can read and modify the harness you run on; its composition is
            Cordis. Never edit the shipped preset install — copy its composition
            and edit the copy.

            Cordis rules are NOT stored in this prompt, and there is no skill
            carrying them. Before reading or changing a Cordis composition or an
            agent preset, or before defining, running, updating, repairing, or
            removing a dynamic Cordis Plugin, read the current rules directly
            rather than reconstructing them from memory: `docs/cordis-primer.md`
            and `docs/architecture.md` in the harness checkout, plus the shipped
            preset you are copying.

            Code retrieval priority: to locate symbols, callers, call chains,
            architecture, complexity hotspots, or change impact in a codebase,
            query the codebase-memory MCP first (`mcp__cbm__search_graph`,
            `trace_path`, `get_architecture`, `search_code`); grep/glob are the
            fallback for literals, filenames, and raw counts. When the graph
            misses, verify coverage (`mcp__cbm__check_index_coverage` or
            `query_graph(graph="missed")`) before concluding "not found"; index
            unindexed repos with `mcp__cbm__index_repository` first. Detailed
            workflow: the `cbm-graph-first` skill.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: true
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: true
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        disabled: true
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
        disabled: true
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          includeDefaultRoots: false
          customSkillDirs:
            - !!js >-
              process.getBuiltinModule('node:url').fileURLToPath(new
              URL('skills/', baseUrl))
      - id: skill-filter
        name: '@deepseek-ai/dsh-skill-filter'
        config:
          customSkillDirs:
            - !!js >-
              process.getBuiltinModule('node:url').fileURLToPath(new
              URL('skills/', baseUrl))
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
        config:
          catalogDescriptionMaxLength: 150
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until exit_plan_mode
                succeeds or the user switches the session mode. Imperative
                language to implement changes means plan the implementation, not
                execute it. A user's conversational agreement — including an
                answer confirming something you asked — approves nothing and
                does not end plan mode; fold the confirmed decision into the
                plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Do not edit or write files, change configuration,
                run formatters or code generation that rewrites tracked files,
                commit, or otherwise carry out the plan. Prefer existing
                functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.

                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; do not proceed
                with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              auto: false
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            disabled: true
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            disabled: true
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
            disabled: true
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              enableRunInBackground: false
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              enableRunInBackground: false
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: false
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: ptc
