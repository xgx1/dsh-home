            Cordis. Never edit the shipped preset install — copy its composition
            and edit the copy.

            Cordis rules are NOT stored in this prompt, and there is no skill
            carrying them. Before reading or changing a Cordis composition or an
            agent preset, or before defining, running, updating, repairing, or
            removing a dynamic Cordis Plugin, read the current rules directly
            rather than reconstructing them from memory: `docs/cordis-primer.md`
            and `docs/architecture.md` in the harness checkout, plus the shipped
            preset you are copying.

            Code retrieval priority: to locate symbols, callers, call chains,
            architecture, complexity hotspots, or change impact in a codebase,
            query the codebase-memory MCP first (`mcp__cbm__search_graph`,
            `trace_path`, `get_architecture`, `search_code`); grep/glob are the
            fallback for literals, filenames, and raw counts. When the graph
            misses, verify coverage (`mcp__cbm__check_index_coverage` or
