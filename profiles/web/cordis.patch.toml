# dsh web profile MCP servers (migrated from OMP mcp.json).
# One @deepseek-ai/dsh-mcp-client instance per server.

[[entry]]
[[entry.insert]]
id = "mcp-cbm"
name = "@deepseek-ai/dsh-mcp-client"

[entry.insert.config]
serverName = "cbm"
transport = "stdio"
        # 2026-10-16 用户要求：UI 开关与端口是 codebase-memory-mcp 的**持久化配置**
        # （`codebase-memory-mcp config list`：ui_enabled=true / ui_port=9749），
        # 由 systemd 的 `codebase-memory-mcp daemon start`（codebase-memory.service）
        # 单点持有；MCP 这行再传一次只是每次启动重写同一份配置，属冗余，故删除。
        # 删除不改行为：缺省不传即不动配置，daemon 仍在 9749 提供 UI。
command = "codebase-memory-mcp"

[[entry.insert]]
id = "mcp-ue"
name = "@deepseek-ai/dsh-mcp-client"

[entry.insert.config]
serverName = "ue"
transport = "streamable-http"
url = "http://127.0.0.1:8000/mcp"
failOnStartupError = false

        # 端点在 UnrealEditor 进程内（编辑器关闭 = 连接失败）。一次停机共用一个尝试
        # 预算，用完就"永久放弃"并注销工具，之后只能靠 HMR / 重启 Host 回来
        # （实测 2026-09-26：编辑器起来后仍报 server is disconnected）。
        # 2026-11-21 用户要求断点续传：退避封顶 30s × 20 万次 ≈ 69 天——会话期间
        # 任何时刻打开编辑器，≤30s 内自动接上并重新注册工具。
[entry.insert.config.reconnect]
initialDelayMs = 2000
maxDelayMs = 30000
maxAttempts = 200000

    # ── CoplayDev/unity-mcp（MCP for Unity）2026-10-14 接入 ──────────────
    # 两端：Unity 侧 UPM 包 com.coplaydev.unity-mcp（git 依赖，钉 v10.3.0）；
    # 客户端走 stdio，由 uvx 拉 Python 服务端 mcpforunityserver==10.3.0（与 UPM
    # 包同版本），服务端再连 Unity 侧的反向桥 127.0.0.1:6400。
    #
    # Unity 侧起桥：默认懒得自启（HTTP 模式才是包默认），用包自带的 CI 入口显式拉起——
    #   Unity -projectPath <proj> -executeMethod MCPForUnity.Editor.McpCiBoot.StartStdioForCi
    # 起了会监听 6400 并写 ~/.unity-mcp/unity-mcp-status-<hash>.json（reason:"ready"）。
    #
    # 代理坑（2026-10-14 实测）：本机全局 all_proxy=socks5://127.0.0.1:7897，httpx
    # 构造期就建 SOCKS 传输层，缺 socksio 直接 ImportError；且 no_proxy 里的 `[::1]`
    # 写法让 httpx 抛 `InvalidURL: Invalid port: ':1]'`。故一律经包装脚本
    # ~/.local/bin/uvx-no-proxy（先清代理变量、换干净的本地白名单再 exec uvx）。
[[entry.insert]]
id = "mcp-unity"
name = "@deepseek-ai/dsh-mcp-client"

[entry.insert.config]
serverName = "unity"
transport = "stdio"
command = "/home/sx/.local/bin/uvx-no-proxy"
args = [ "--from", "mcpforunityserver==10.3.0", "mcp-for-unity", "--transport", "stdio" ]
        # 编译、进播放模式这类调用超过默认 60s。
toolCallTimeoutMs = 180000
failOnStartupError = false

        # 断点续传：stdio 断线靠重起 uvx→python，退避封顶 60s（每分钟一次）、
        # 10 万次 ≈ 69 天——Unity 与 6400 桥任何时候起来都能接上。
[entry.insert.config.reconnect]
initialDelayMs = 5000
maxDelayMs = 60000
maxAttempts = 100000

    # ── 用户调整（2026-09-20）：桌面控制挂 Cua Driver native（0.1.6 新能力，实验性）─
    # dsh-computer-use 同样是**互斥单注册**（"A deployment can enable one
    # computer-use provider at a time"），Cua 的两个实现只能挂一个。
    # 选 native 而不是 MCP 版的原因：MCP 版要 PATH 上有独立的 `cua-driver` 可执行
    # （trycua/cua 那个 Rust 应用，还得给 OS 授桌面权限），本机没装；native 版直接用
    # 已装的 @trycua/cua-driver@0.28.0（linux-x64-gnu 二进制已在 node_modules），零配置。
    # 代价：native 运行时与 dsh-web **同进程**，native 崩溃会带走 dsh-web。装上独立
    # Cua 应用后换成下面这段（独立进程，崩了不带走 dsh-web）：
    #   - id: computer-use-cua-mcp
    #     name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
    #     config:
    #       command: cua-driver
    #       args: [mcp]
    # 截图要生效还需 attachment store + 声明 image 输入的模型路由。
    # 工具命名空间：native 版 `cua_driver_native__*`（无 mcp__ 前缀）；MCP 版 `mcp__cua-driver-mcp__*`。
[[entry]]
[[entry.insert]]
id = "computer-use"
name = "@deepseek-ai/dsh-computer-use"

[[entry.insert]]
id = "computer-use-cua-native"
name = "@deepseek-ai/dsh-experimental-computer-use-cua-driver-native"

