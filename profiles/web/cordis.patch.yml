      # isSubscription: true、baseUrl https://chatgpt.com/backend-api），
      # 走的就是 Codex CLI 那套官方订阅授权。DSH 唯一排除的是 `openai` 那条
      # OAuth（它要求 app 提供 installation UUID，见 llm-pi-ai/src/login.ts:31 的
      # UNSERVED_OAUTH），`openai-codex` 照常可登录、可路由。
      #
      # 这条 route 故意不写 apiKeyEnv：profile 不点名凭据时，llm-pi-ai 原样复用
      # catalog provider 自己的 OAuth auth（src/provider.ts 的 routeAuth /
