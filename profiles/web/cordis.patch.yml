# `deepseek-v4.1-flash-expires-on-0910`，两者均不在 settings.yaml 的模型目录里，
# 属失效引用；子 agent 的模型选择由 subagent-model-selection 的 allowedModels 控。
# tool-subagent 段整段删除：其 config 与 preset 值逐键相同（除 agentOptions），
