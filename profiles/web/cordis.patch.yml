            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            disabled: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"
          - id: skill-filter
            name: '@deepseek-ai/dsh-skill-filter'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"
