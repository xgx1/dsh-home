      # ── 用户要求（2026-11-10）：opencode Go 接入，只留免费模型 + DeepSeek V4.1 Flash ──
      # 走 Go 官方端点 .../inference/go/openai/v1（模型清单 .../inference/go/v1/models）。
      # 必须带 x-opencode-session，否则 400 MissingSessionID；pi-ai 的 provider `headers`
      # 可以写（旧 :8790 中继那条注释说 UA 写不进去，session 头没有这个问题）。
      # 凭据 refs.OPENCODE_API_KEY = 控制台 Personal API key（90 天有效期，2026-11-10 新建）。
      # 账号 s_xgx1@outlook.com / workspace Default，Go 已订阅（2026-11-10 实测）：
