# dsh web profile MCP servers (migrated from OMP mcp.json).
# One @deepseek-ai/dsh-mcp-client instance per server.
- insert:
    - id: mcp-cbm
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cbm
        transport: stdio
        command: codebase-memory-mcp
        args:
          - '--ui=true'
          - '--port=9749'

    - id: mcp-ue
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ue
        transport: streamable-http
        url: http://127.0.0.1:8000/mcp
        failOnStartupError: false

# ── 用户调整（2026-09-10）：headroom MCP 从死配置改为 stdio 直连 ─────────
# headroom 自带 MCP：`headroom mcp serve`（serverName=headroom，v1.29.1），
# 暴露 headroom_compress / headroom_retrieve / headroom_stats 三个工具，
# 数据取自常驻代理 headroom-deepseek.service（127.0.0.1:8787，实测在跑）。
# 旧配置写的是 streamable-http://127.0.0.1:8791/mcp —— 本机从来没有 8791 服务
# （仅从旧客户端 mcp.json 迁移过来的条目），又带 failOnStartupError:false，
# DSH 静默跳过，导致会话里一直没有 mcp__headroom__* 工具。
# 改 stdio 后由 dsh-web 自己拉起，与 cbm / playwright 同一机制，
# 不再依赖外部守护进程，也不会再有"服务没起就静默消失"的失败模式。
# 实测：初始化握手 639ms，环境 PATH 含 ~/.local/bin，headroom 可解析。
# 又实测：DSH 会热加载本 patch —— 改完立刻重拉 MCP 子进程，无需重启 dsh-web。
# 必须清代理：dsh-web 继承 ~/.config/environment.d/99-proxy.conf 的
# all_proxy=socks5://127.0.0.1:7897，MCP 子进程拿 httpx 走它去连本地 8787，
# 报 "Using SOCKS proxy, but the 'socksio' package is not installed" → stats 里
# proxy 显示 unreachable（no_proxy 对 all_proxy 的 all:// 挂载不生效）。
# 这与 headroom-*.service 里 Environment=ALL_PROXY= 的既有做法一致：
# MCP 只连本机 8787，代理必须清空；no_proxy 一并显式给上以兼顾其他库。
# 若日后要改回共享服务，用 headroom mcp serve --transport http --port 8791
# （实测 HTTP 通道握手正常），补个 systemd 用户单元再换回 streamable-http 即可。
- insert:
    - id: mcp-headroom
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: headroom
        transport: stdio
        command: headroom
        args:
          - mcp
          - serve
        env:
          all_proxy: ''
          ALL_PROXY: ''
          http_proxy: ''
          HTTP_PROXY: ''
          https_proxy: ''
          HTTPS_PROXY: ''
          no_proxy: 'localhost,127.0.0.1,::1'
          NO_PROXY: 'localhost,127.0.0.1,::1'
        failOnStartupError: false

# ── 用户调整（2026-09-20）：浏览器控制迁到 DSH 0.1.6 的 browser-use provider ─
# 旧接线：dsh-mcp-client 直挂全局裸 @playwright/mcp（`mcp__playwright__*`），
# 靠 --cdp-endpoint attach 到 find-work 管的共享 Chrome（9222）复用登录态。
# 新接线：DSH 自带 dsh-browser-use 服务 + Playwright provider，同样 attach 9222，
# 登录态原地继承，不用搬 user-data-dir。DSH provider pin 的 @playwright/mcp 也是
# 0.0.80（同版本同工具清单），但命名空间变成 `mcp__playwright-mcp__*`。
# 技能文字未受影响：~/.dsh/skills 下 grep `mcp__playwright` 命中 0（技能只按
# browser_navigate / browser_snapshot 等短名引用）。browser-mcp-playwright 技能里
# references/setup-mcp.md 的接线描述已过时（那套是裸 @playwright/mcp 的 CLI 参数）。
#
# 硬约束（读 README 确认）：dsh-browser-use 是**互斥单注册**——
# "A deployment can enable one browser-use provider at a time. Loading another
# provider fails with the registered provider name." 所以三个浏览器 provider
# 只能挂一个，不能"全部挂上"。三个包的依赖都已装进 apps/cli/package.json，
# 切换只需在本文件里换段，不用重装、不用改检出。
#
# attach 模式的独占语义：默认 `exclusive: true`，新 live Session 在初始化时认领
# attachment 并持有到卸载；attachment 忙时该次激活**直接跳过浏览器、后续轮次不重试**；
# 另一个 Session 直连会失败。也就是说默认同一时刻只有一个会话能用 9222 那个 Chrome。
# 下面 config 里已显式关掉（`exclusive: false`）：每个 live Session 各自起一个
# @playwright/mcp 挂同一个 9222，谁创建谁都能拿到浏览器工具，不用再"先关别的会话"。
# 代价是没有串行保证——多会话同时操作同一个 Chrome 需要自己排队
# （find-work/docs/adr/0004-shared-browser-session.md 本来就是这个约定）。
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      config:
        mode: attach
        endpoint: 'http://127.0.0.1:9222'
        exclusive: false

    # 备选 1：Chrome DevTools MCP（与 Playwright 同构配置）
    #   工具命名空间 `mcp__chrome-devtools-mcp__*`（与 playwright-mcp 不同，
    #   是 CDP 直接驱动，工具集偏 inspection/控制）。
    # - id: browser-use-devtools
    #   name: '@deepseek-ai/dsh-experimental-browser-use-chrome-devtools-mcp'
    #   config:
    #     mode: attach
    #     endpoint: 'http://127.0.0.1:9222'
    #
    # 备选 2：Stagehand native（AI 辅助的浏览器自然语言操作）
    #   必须配**非 DeepSeek** 的模型 key：pin 的 SDK 只认 OpenAI / Anthropic /
    #   Google / Groq / Cerebras，README 明写 DeepSeek endpoint 与 baseURL 覆盖
    #   都不支持。而且 `model` 必填，即使只做导航。挂载步骤：
    #     ① 拿一个 OpenAI key，export OPENAI_API_KEY（或写进启动环境）
    #     ② 解开下面这段注释（同时注释掉上面的 playwright 段）
    #     ③ attach 模式额外要求 Chrome 带 --remote-allow-origins=* 与
    #        --enable-unsafe-extension-debugging（当前 9222 那个没带，得重开）
    # - id: browser-use-stagehand
    #   name: '@deepseek-ai/dsh-experimental-browser-use-stagehand-native'
    #   config:
    #     mode: attach
    #     cdpEndpoint: 'http://127.0.0.1:9222'
    #     operationTimeoutMs: 60000
    #     model:
    #       modelName: openai/gpt-5.4-mini
    #       apiKey: !!js process.env.OPENAI_API_KEY

# ── 用户调整（2026-09-20）：桌面控制挂 Cua Driver native（0.1.6 新能力，实验性）─
# dsh-computer-use 同样是**互斥单注册**（"A deployment can enable one
# computer-use provider at a time"），Cua 的两个实现只能挂一个。
# 选 native 而不是 MCP 版的原因：MCP 版要 PATH 上有独立的 `cua-driver` 可执行
# （trycua/cua 那个 Rust 应用，还得给 OS 授桌面权限），本机没装；native 版直接用
# 已装的 @trycua/cua-driver@0.28.0（linux-x64-gnu 二进制已在 node_modules），零配置。
# 代价：native 运行时与 dsh-web **同进程**，native 崩溃会带走 dsh-web。装上独立
# Cua 应用后换成下面这段（独立进程，崩了不带走 dsh-web）：
#   - id: computer-use-cua-mcp
#     name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
#     config:
#       command: cua-driver
#       args: [mcp]
# 截图要生效还需 attachment store + 声明 image 输入的模型路由。
# 工具命名空间：native 版 `cua_driver_native__*`（无 mcp__ 前缀）；MCP 版 `mcp__cua-driver-mcp__*`。
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'

# ── 用户覆盖：彻底移除沙箱层 + 开启会话全文搜索 ────────────────────────────
# 所有会话永久全权限，无 read-only/workspace-write 档位。
# - sandbox（执行器）关闭：命令执行不再受限
#   (2026-09-20) sandbox provider 恢复启用：dsh 0.1.6 的 ptc-runtime 硬依赖
#   ctx.sandbox（只在 provider 存在时提供 ptcRuntime），禁用会让 ptcRuntime
#   一直 pending，进而 workflow-ptc / tool-workflow / tool-ralph 挂载失败，
#   omni/manager preset 无法挂载（表现为新会话创建失败、消息发不出去）。
#   实际围栏不看 provider 是否存在，只看下面 sandbox-policy 的
#   danger-full-access 短路（ptc-runtime-node/src/index.ts:224）；
#   bash-local / fs-local 仍是实际执行后端，语义不变。
# - sandbox-policy 保持启用（2026-09-12 修复）：dsh 0.1.5 起 workspace-files /
#   ui-deliverables 硬依赖 ctx.sandboxPolicy；禁用会导致插件树 pending，
#   dsh-web 启动即崩（NRestarts 24）。policy 服务本身不执行任何管控，
#   真正的执行/围栏后端（sandbox / bash-sandbox / fs-sandbox）仍全部关闭。
# - sandbox-policy 默认 mode 固定 danger-full-access（2026-09-12）：
#   base 默认是 workspace-write，而 terminal-bash 的 spawnArgv 只在
#   danger-full-access 时短路返回裸 argv；其他档位会硬要 ctx.sandbox
#   provider（已禁用）→ "requires a ctx.sandbox provider" 报错。
#   policy 只是把模式告诉消费者，本身不做执行，故对全权限语义无副作用。
#   注意：patch 整行替换 config（不合并），两个键都要复述。
# - bash-sandbox / pwsh-sandbox 关闭：不挂受限 shell 执行器
# - fs-sandbox 关闭 → fs-local 接管 fs 服务（无政策围栏的本地后端）
# - bash-local 提供 shell 服务（普通 bash 进程，无受限令牌包装）
# - permission / ui-permission 关闭：permission-presets 在无限制执行器下
#   会硬性加载失败（要求 shell.sandboxMode 存在），权限切换页随之移除
# - approval 固定 never：无 permission 服务驱动会话策略后，保持当前
#   无审批弹窗行为

- id: sandbox
  disabled: false

- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: permission
  disabled: true

- id: ui-permission
  disabled: true

# approval：完全关闭审批 seam（disabled 后不加载，不再有 policy）
- id: approval
  disabled: true

# 会话全文搜索：首个搜索请求时惰性建库（不拖慢启动），索引落在 DSH_HOME 根下
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.db')
    openAt: first-search

# 无沙箱替代品：本地文件系统 + 本地 bash 执行器
- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'

    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

# ── 模型路由：子 agent 固定走 DeepSeek 官方 headroom（deepseek-v4.1-flash-expires-on-0910）──
# 主 agent 默认模型同为 deepseek-official / deepseek-v4.1-flash-expires-on-0910。
# 此 patch 在 dsh-web 重启后生效。
# 整行替换 config（patch 不合并）。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4.1-flash-expires-on-0910

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4.1-flash-expires-on-0910

# ── 临时禁用（2026-09-20，DSH 0.1.6 升级）：dsh-evolve-modes ────────────
# dsh-web 升到 0.1.6-alpha.2 后，该 vendor 插件（v0.4.0，仅适配 0.1.5-rc.2）
# 被 0.1.6 的 typert-loader 拒绝激活，启动报：
#   typert-loader: @graysilver/dsh-evolve-modes invocation
#   "@graysilver/dsh-evolve-modes#evolveModes/dashboard" parameter codec has
#   no create() factory
# 根因：0.1.5→0.1.6 的 strict codec 契约从 { mode, typeSymbol, schema } 改成
# { mode, typeSymbol, create: () => TypertSchema }（见
# packages/typert/protocol/src/types.ts 的 TypertCodec、typert/registry/src/
# service.ts:643 的 materializeSchema）。上游 v0.4.1 只回补了 0.1.2 兼容，
# 没有 0.1.6 适配版。
# 完整迁移量（不止 codec）：src/evolution/wire.ts 2 处 codec；
# src/client/index.tsx 12 个类型错误，涉及 4 个 API 面
#   ① ctx.remote.commands.execute（ClientRemote 结构变更）
#   ② ctx.slots.register 的 select/inject 选项（slots 注册 API 变更）
#   ③ scope.remote.evolveModes（注入的 remote 访问方式变更）
#   ④ ContextMessageNode 新增必填 producer
# 外加 45 个 @deepseek-ai/dsh-* 包的 peer 版本碎片（0.1.5-rc.2 / 0.1.6-alpha.2
# 双份并存），需要 pnpm.overrides 统一。
# 恢复：改好上游 → pnpm run build → 删除下面 2 行 + 重启 dsh-web。
# 注意：依赖 @graysilver/dsh-evolve-modes 仍留在 package.json 的 dependencies
# 与 dsh.profile.bundles 里（bundle 层保留，仅关掉这一个 entry），这样
# 恢复时不用重新接线。
- id: dsh-evolve-modes
  disabled: true

