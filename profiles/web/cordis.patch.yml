- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      md:
        apiKeyEnv: MD_API_KEY
        api: openai-completions
        baseURL: https://api-inference.modelscope.cn/v1
        models:
          - id: deepseek-ai/DeepSeek-V4.1-Flash
            name: deepseek-ai/DeepSeek-V4.1-Flash
            contextWindow: 1000000
            maxTokens: 256000
      # ChatGPT Plus 订阅额度（用户要求 2026-10-15）。pi-ai 自带 catalog provider，
      # 端点是 chatgpt.com/backend-api（Codex 协议），凭据不是 apiKeyEnv 而是
      # .credentials.yaml 的 grant 记录 llm-pi-ai/openai-codex，由
      # ~/.local/bin/dsh-codex-cred 从 ~/.codex/auth.json 灌入；codex CLI 刷新
      # token 后重跑该脚本。模型目录同 codex：gpt-5.6-* / gpt-6-* 可用，
      # gpt-5.3-codex-spark 与 gpt-5.5 在 ChatGPT 账号下会被端点拒绝。
      # models 是白名单：写进即替换 catalog 全表。gpt-5.3-codex-spark 与 gpt-5.5
      # 被端点拒（"not supported when using Codex with a ChatGPT account"），不列。
      openai-codex:
        displayName: ChatGPT Plus (Codex)
        models:
          - id: gpt-6-astra
          - id: gpt-6-luna
          - id: gpt-6.1-sol
      sensenova:
        displayName: SenseNova token plan (Responses API)
        apiKeyEnv: SENSENOVA_API_KEY
        api: openai-responses
        baseURL: https://token.sensenova.cn/v1
        reasoning: xhigh
        compat:
          supportsDeveloperRole: true
          supportsMaxOutputTokens: true
          supportsStrictMode: true
        models:
          - id: deepseek-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 256000
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: sensenova-6.8-flash-lite
            name: sensenova-6.8-flash-lite
            contextWindow: 262144
            maxTokens: 256000
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
      step:
        displayName: StepFun Step Plan
        apiKeyEnv: STEP_API_KEY
        api: openai-completions
        baseURL: https://api.stepfun.com/step_plan/v1
        reasoning: medium
        compat:
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: step-5-preview
            name: step-5-preview
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
