# ── 用户要求（2026-09-25）：goal 相关插件全部启用 ────────────────────────
# 目标系统留在 host plane 的三项：服务（ctx.goals）、自动续跑 driver、
# GUI 目标栏（ui-goal，另见下方条目）。
# goal-round-driver 只在会话空闲、goal 为 active 且续跑已 arm 时追加轮次；
# 轮数上限由 goal 自身的 maxGoalRounds（默认 256）约束，没有 goal 时它不做事。
# 另两项（人类命令 command-goal / 模型工具 tool-goal）归 preset plane，
# 由 .agent-presets/omni|manager 注册——两层同时注册同一工具 id 会 fail loud
# （见 dsh-web-app bundle 与 shipped cordis preset 的同一条注释），故此处保持
