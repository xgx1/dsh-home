      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: unreal
        name: Unreal 项目
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness.
                You can read and modify the harness you run on; its composition is Cordis. Never edit the shipped preset install — copy its composition and edit the copy.
                Cordis rules are NOT stored in this prompt, and there is no skill carrying them. Before reading or changing a Cordis composition or an agent preset, or before defining, running, updating, repairing, or removing a dynamic Cordis Plugin, read the current rules directly rather than reconstructing them from memory: `docs/cordis-primer.md` and `docs/architecture.md` in the harness checkout, plus the shipped preset you are copying.
                Code retrieval priority: to locate symbols, callers, call chains, architecture, complexity hotspots, or change impact in a codebase, query the codebase-memory MCP first (`mcp__cbm__search_graph`, `trace_path`, `get_architecture`, `search_code`); grep/glob are the fallback for literals, filenames, and raw counts. When the graph misses, verify coverage (`mcp__cbm__check_index_coverage` or `query_graph(graph="missed")`) before concluding "not found"; index unindexed repos with `mcp__cbm__index_repository` first. Detailed workflow: the `cbm-graph-first` skill.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
