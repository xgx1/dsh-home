# ── 0.2.1 settings.yaml 迁移补遗（2026-10-14）──────────────────────────────
# 0.2.1 启动时把 $DSH_HOME/settings.yaml 改名成 settings.yaml.imported，并把可写字段
# 导入 profile patch。五节没导进来，原因逐条写明；下面按 0.2.1 的条目 id 补回，值与原
# settings.yaml 一致（.imported 里仍留原件备查）：
#   · llm-deepseek             原节含 0.2.1 已删除的 protocol 字段，校验不过
#   · shell                    LEGACY 映射到 bash-sandbox，而该条目被本 patch disabled，
#                              用户实际执行器是 bash-local
#   · subagent-model-selection  条目 id 改为 subagent-model-selection-settings
#   · agent-presets             条目 id 改为 agent-preset-registry
#   · permission                permission 条目被本 patch disabled（无限制执行器），
#                              这节的 defaultPreset 属预期丢弃
# patch 的 config 是整条目替换，不合并，故每节都写全。
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    # 0.2.1 的 llm-deepseek（api-key provider）本身就是 Messages 协议
    # （PUBLIC_BASE_URL = https://api.deepseek.com/anthropic），原 protocol 字段已删。
    thinking: enabled
    # 线上 supported_levels = low/high/max，default high；新会话档位另由 agent-default-model 给
    reasoningEffort: low
    # 目录对齐线上 GET /models（2026-10-03 实测）：context 1048576、max_output 393216、
    # effort low/high/max(默认 high)。flash 带图，v4-pro 仅文本（无 imagePixelBudget）。
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1048576
        maxTokens: 393216
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
        systemPromptUpdate: in-history
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: 更强的 agentic 编码与难推理，质量优先/复杂任务用，成本更高；仅文本输入。
        contextWindow: 1048576
        maxTokens: 393216
        inputModalities:
          - text

# 原 settings.yaml 的 shell.timeoutMs = 1800000（30 分钟）。落到实际执行器 bash-local 上，
# 并同步抬高 maxTimeoutMs——默认上限 600000 会把请求钳回去。
- id: bash-local
  config:
    timeoutMs: 1800000
    maxTimeoutMs: 1800000

- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      # 2026-10-23 事故修复：模型 id 必须与 llm-pi-ai 里 `md` 注册的 id 完全一致。
      # 原写 deepseek-ai/DeepSeek-V4.1-Flash（无 -1017 后缀），ModelScope 已下线该
      # 别名，任何走这条的请求都 400 `has no provider supported`（会话 134e19ed 实测）。
      - provider: md
        model: deepseek-ai/DeepSeek-V4.1-Flash-1017
      - provider: sensenova
        model: sensenova-6.8-flash-lite
      - provider: sensenova
        model: deepseek-flash

# 2026-10-17 用户要求：删除全能(omni)/管理(manager)/简单(simple) 三个预设，
# omni 的能力折进类型预设（基础树见 ~/.dsh/preset-base.yml，类型清单见
# ~/.dsh/type-presets.yaml，由 ~/.dsh/bin/gen-project-presets.py 生成）。
# 默认预设因此改为 js（通用编码类型）；要别的类型在新建会话时挑。
- id: agent-preset-registry
  config:
    default: js

# ── 用户要求（2026-10-14）：禁用右侧面板（文件 / 浏览器 / 终端 / 文档预览）──────
# ui-sidebar-right 的 panel:false 只停住「面板 + 会话头展开按钮」两处挂载；
# ctx.sidebarRight 服务与 sidebarRightTabs 注册表照常提供，ui-chat / ui-reference /
# ui-plan / ui-deliverables / ui-schedule 等 inject 它的插件不会卡在 pending。
# （整行 disabled 会把这些插件一起打掉，对话区直接空白，故不能用 disabled。）
# 文件路径点击改由系统默认程序打开：ui-chat 的 openFile 已改走 Host 桌面，
# Sidebar 只作兜底。
- id: ui-sidebar-right
  config:
    panel: false

# ── 用户要求（2026-10-14）：/goal 不依赖 preset 面 ───────────────────────────
# command-goal 在 web-app bundle 的 host 面被 disabled（packages/bundle/web-app/
# cordis.patch.yml），靠 preset 面补挂；preset 面一死 /goal 就消失（08:05 实测）。
# 命令注册表是「全局 + 会话域遮蔽」语义，两层同时注册不会 fail loud，故在 host 面
# 直接补一行。**不要**照做 tool-goal（create_goal/get_goal/update_goal）：工具 id
# 重复注册会 fail loud，host 面挂它会让所有 preset 会话起不来。
- id: command-goal
  disabled: false

# ── 用户要求（2026-10-14）：接入 REA（morluto/rea）逆向证据层 ──────────────────
# npm 包 rea-agents@6.4.0 已全局装（~/.npm-global/bin/rea；~/.local/bin/rea 是它的软链，
# 与 codebase-memory-mcp 同路——dsh-web 进程的 PATH 里确实有 ~/.local/bin）。
# 已装引擎：Ghidra 12.1.2（Arch extra 包，树在 /opt/ghidra）、JADX、binwalk、
# pwntools + pwndbg、mitmproxy、完整 JDK（java-environment）、adb、.NET SDK。
# Hopper / IDA / JEB 是付费软件或自带服务，本机没有；对应 provider 报 unavailable 属预期。
#
# 两个非默认值都有实测依据：
#   1. GHIDRA_INSTALL_DIR：REA 只在未设该变量时才去 PATH 找 ghidra / ghidraRun，且要求
#      解析出的真实路径属于一棵 Ghidra 树；Arch 的 /usr/bin/ghidra 是包装脚本
#      （launch.sh bg jdk Ghidra），不是树内文件，PATH 发现必然失败
#      （实测 doctor：ok=false, detail=GHIDRA_INSTALL_DIR is not set）。显式给 /opt/ghidra
#      后 doctor 该 provider 全绿：12.1.2; compatible 12.1.x release。
#   2. toolCallTimeoutMs：REA 侧 Ghidra 冷启动默认允许 330,000 ms
#      （REA_GHIDRA_STARTUP_TIMEOUT_MS，REA 自己的下限），而 dsh-mcp-client 默认每次工具
#      调用 60,000 ms 即取消——首次 binary_overview 很可能死在导入阶段。放大到 600,000 ms。
- insert:
    - id: mcp-rea
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        command: rea
        args:
          - mcp
        env:
          GHIDRA_INSTALL_DIR: /opt/ghidra
        toolCallTimeoutMs: 600000

# ── dsh-ops（2026-10-16，fork xgx1/dsh-ops 的 Linux 移植）────────────────
# 上游 0.3.0 只有 Windows x64；fork 放开平台门并修了 Linux 上的 O_PATH 目录
# fsync（EBADF）bug。四个组件都开：
#  · shell：宿主 bash（bashPath=/usr/bin/bash）。Linux 没有随包 bash/pwsh
#    载荷，allowSystemShellFallback 又被 config update 1 强制改回 false，
#    所以 bashPath 是唯一开关。实测 ops_bash exit 0。
#  · background：同一份 bashPath 必须也写在**本行**——每行各自解析 shell，
#    缺它本行发布不出 command/job 工具；command 工具另需 worker 处于
#    danger-full-access（本 profile 正是）。FastCtx 由
#    `node bin/dsh-ops.mjs build --force` 在 vendor/fastctx 就地构建。
#  · file/ptc：本地 Rust worker（`npm run build:ptc` → runtime/linux-x64）。
# PTC 工具只在「纯 PTC 呈现」的 agent 里注册，由 preset 的 tool-presentation
# 行决定（omni 与 manager 都已切 mode: ptc）。改动细节与构建命令见
# vendor/dsh-ops/LOCAL-PATCHES.md。
- id: dsh-ops-shell
  disabled: false
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    bashPath: /usr/bin/bash
    # D2：文件与检索路由（file 组件已按 D1 关闭，故路由只能靠提示词兜住）。
    # 措辞与 harness 内建文件工具的说明保持一致，不新增能力，只交代选哪一个。
    extraGuidance: |-
      文件与检索路由（本部署的文件工具面只有宿主的 read/write/edit/read_image + zvecgrep）：
      - 新建或整篇覆盖 → write；改一处精确文本或清点 → edit；看内容先 read。
      - 穷尽精确检索（字面、正则、文件名）→ zvec_grep_rg（真 ripgrep，尊重 .gitignore）。
      - 语义/跨文件理解类检索 → zvec_grep_search（要求该工作区已建索引；未建会报 WORKSPACE_INDEX_NOT_FOUND）。
      - 裸 grep / glob 在本部署不存在；不要找它们，也不要改用 shell 里的 grep 绕开。
- id: dsh-ops-background
  disabled: false
  config:
    promptPolicy: true
    enableShellTools: true
    required: false
    toolCallTimeoutMs: 300000
    bashPath: /usr/bin/bash
# ── 用户要求（2026-10-16，D1）：关掉 dsh-ops 的 file 组件 ──────────────────
# file 组件发布的 ops_inspect_local_file / ops_grep / ops_glob / ops_replace 与
# read/edit/write 及 zvecgrep 的 zvec_grep_rg 部分重叠。取舍：省 4 个工具，
# 代价是丢 ops_replace（带 glob 的跨文件字面批量替换）与 ops_inspect_local_file
# （hex / 编码 / PDF / 多区间读取）；需要时把本行改回 disabled: false 即恢复。
# 同一 worker 的 PTC 组件（dsh-ops-ptc）不在本行开关内，仍启用。
- id: dsh-ops-file
  disabled: true
  config:
    promptPolicy: true
    enableShellTools: false
    required: false
    toolCallTimeoutMs: 300000
- id: dsh-ops-ptc
  disabled: false
  config:
    required: false

# ── 用户要求（2026-10-17）：工具按需加载 ────────────────────────────────────
# 400+ 枚注册工具的目录成本（PTC 下生成 SDK 段 267,755 字符，占系统提示 94%）
# 只有靠「少注册」才能真正压下来。开启 plugin_manager 工具，让模型能在
# 运行期 set_plugin 关/开整族 MCP（如 mcp-rea），不必改文件重启。
# 代价：多 1 枚工具；每次调用需 danger-full-access 审批（本 profile 全权限常开）。
- id: tool-plugin-manager
  disabled: false
- id: mcp-rea
  disabled: true

# <<< BEGIN generated type presets — 改 ~/.dsh/type-presets.yaml 或 ~/.dsh/preset-base.yml 后跑 ~/.dsh/bin/gen-project-presets.py >>>
- id: mcp-unity
  disabled: true
- id: mcp-ue
  disabled: true
- id: computer-use-cua-native
  disabled: true
- id: dsh-blender-plugin
  disabled: true
- id: browser-use-playwright
  disabled: true
- insert:
    - id: preset-js
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: js
        name: JS 项目
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness.
                You can read and modify the harness you run on; its composition is Cordis. Never edit the shipped preset install — copy its composition and edit the copy.
                Cordis rules are NOT stored in this prompt, and there is no skill carrying them. Before reading or changing a Cordis composition or an agent preset, or before defining, running, updating, repairing, or removing a dynamic Cordis Plugin, read the current rules directly rather than reconstructing them from memory: `docs/cordis-primer.md` and `docs/architecture.md` in the harness checkout, plus the shipped preset you are copying.
                Code retrieval priority: to locate symbols, callers, call chains, architecture, complexity hotspots, or change impact in a codebase, query the codebase-memory MCP first (`mcp__cbm__search_graph`, `trace_path`, `get_architecture`, `search_code`); grep/glob are the fallback for literals, filenames, and raw counts. When the graph misses, verify coverage (`mcp__cbm__check_index_coverage` or `query_graph(graph="missed")`) before concluding "not found"; index unindexed repos with `mcp__cbm__index_repository` first. Detailed workflow: the `cbm-graph-first` skill.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true # 2026-09-13 用户要求禁用自带 grep（改用 zvecgrep MCP 的检索）
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            disabled: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"
          - id: skill-filter
            name: '@deepseek-ai/dsh-skill-filter'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            config:
              catalogDescriptionMaxLength: 150
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.
                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.
                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.
                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.
                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: false
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                disabled: true
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                disabled: true
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
                disabled: true
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
