            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
      # ── 从 Linux profile 搬来（2026-10-18）：StepFun Step Plan ────────────
      # 需要 .credentials.yaml refs.STEP_API_KEY；本机 refs 里没有该键，
      # 在补上之前这个 provider 不可选（配置本身不会报错）。
      step:
        displayName: StepFun Step Plan
