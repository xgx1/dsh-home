# ── 用户预设迁移（2026-10-13，DSH 0.2.1）─────────────────────────────────────
# 0.1.6 的 ~/.dsh/.agent-presets/<id>/{preset.yml,agent.cordis.yml} 布局在 0.2.1
# (dsh-v0.2.1-alpha.2) 不再被读取：预设改为组合里的 `@deepseek-ai/dsh-agent-preset`
# declaration 行。下面把三个用户预设（omni / manager / simple）原样迁移过来，
# plugins 列表逐字复制自各自的 agent.cordis.yml（含 `!!js` 表达式与注释）。
# 原目录保留未删，作为回滚点。

- insert:
    - id: preset-omni
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: omni
        name: 全能模式
        description: 融合三种模式：标准模式的全部工具与工作流、PTC 模式的 Code Mode（原生目录与 run_code SDK
          双呈现）、创造模式的运行时检查与 preset 创作能力。
        order: 5
        plugins:
          # The `omni` agent preset (全能模式): 标准模式 + PTC 模式 + 创造模式 combined
          # into one composition. Everything in `standard` is here unchanged; on top of
          # it this preset adds exactly what each other shipped mode contributes, and
          # nothing else:
          #
          # - From `code` (PTC 模式): the `tool-presentation` row. Originally
          #   `mode: both` — every native schema AND `run_code` with the generated SDK.
          #   2026-09-20 changed to `mode: native` by user decision: `both` sent the
          #   whole catalog twice (native 98,533 chars + Code Mode SDK 69,017 chars,
          #   58% of fixed injection) while measured `run_code` usage was zero. Cost:
          #   `run_code` is no longer in the catalog.
          # - From `cordis` (创造模式): the `tool-cordis` runtime-inspection toolset.
          #   The two preset-traveling authoring skills this preset used to advertise
          #   (`editing-cordis-compositions`, `cordis-plugin-development`) are gone:
          #   `skills/` next to this file is empty, so the persona no longer names them
          #   and instead points at `docs/cordis-primer.md` + `docs/architecture.md`.
          #
          # TRUST: the cordis toolset evaluates model-written JavaScript against the
          # live runtime, and a composition this agent writes becomes a preset other
          # sessions mount. Treat a session on this preset as shell access — the same
          # statement the `cordis` preset makes about itself.
          #
          # Adapted from the builtin `standard`, `code`, and `cordis` presets.
          #
          # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
          # standing scope; every session naming it joins by scope parentage, so the
          # tools and prompt sections registered here cover each joined agent while a
          # session's own state stays keyed per Session/Agent inside the plugins. The
          # host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global —
          # another preset publishing the same name collides, and a host reader would
          # resolve one preset's instance for every session; `dsh-agent-presets` rejects
          # that at mount. `true` means an entry-local realm: this standing mount's own
          # private instance, apart from every other preset's. (A shared label does NOT
          # pool instances — `provide()` throws on the second registration under the
          # same realm symbol; labels join REALMS, and are not what this file needs.)

          # ── identity ────────────────────────────────────────────────────────────────

          # Merged persona, kept deliberately lean: the standard coding-agent line, one
          # paragraph for the dual presentation (`mode: both`), and a skill-call index
          # that points agents to the on-demand skills below instead of inlining the
          # two-plane and plugin-authoring rules into every session's first prompt.
          # `{{model}}` resolves from the agent's own route; the working directory arrives
          # via the working-directory runtime-context snapshot, not a prompt variable.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness.

                You can read and modify the harness you run on; its composition is Cordis. Never edit the shipped preset install — copy its composition and edit the copy.

                Cordis rules are NOT stored in this prompt, and there is no skill carrying them. Before reading or changing a Cordis composition or an agent preset, or before defining, running, updating, repairing, or removing a dynamic Cordis Plugin, read the current rules directly rather than reconstructing them from memory: `docs/cordis-primer.md` and `docs/architecture.md` in the harness checkout, plus the shipped preset you are copying.

                Code retrieval priority: to locate symbols, callers, call chains, architecture, complexity hotspots, or change impact in a codebase, query the codebase-memory MCP first (`mcp__cbm__search_graph`, `trace_path`, `get_architecture`, `search_code`); grep/glob are the fallback for literals, filenames, and raw counts. When the graph misses, verify coverage (`mcp__cbm__check_index_coverage` or `query_graph(graph="missed")`) before concluding "not found"; index unindexed repos with `mcp__cbm__index_repository` first. Detailed workflow: the `cbm-graph-first` skill.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true # 2026-09-13 用户要求禁用自带 grep（改用 zvecgrep MCP 的检索）
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset,
          # PLUS the two authoring skills that travel with this preset directory (the
          # cordis preset's pattern): they document THIS deployment's two planes, and a
          # preset is the unit that gets copied and edited. `baseUrl` is the preset's
          # own directory, so the root resolves wherever the preset is installed. The
          # merged catalog also carries whatever the deployment registered globally
          # (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"

          - id: skill-filter
            name: '@deepseek-ai/dsh-skill-filter'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            config:
              # 2026-09-20 精简：310 条技能目录 81,964 字符描述，平均 264 字符/条。
              # 默认上限 500 基本没起作用（只有 5 条超过），所以真正的杠杆是这里。
              # 150 截断后降到 41,089 字符（-50%），触发词与「做什么/何时用」都在前 150 字符内。
              # 上限下限是 3（z.number min 3）。
              catalogDescriptionMaxLength: 150

          # ── goals ───────────────────────────────────────────────────────────────────

          # 2026-09-25 用户要求：goal 相关插件全部启用。分工对齐 dsh-web-app bundle 的
          # 注释——服务与 session driver 留 host plane，人类命令与模型工具归 preset：
          #   host plane（profiles/web/cordis.patch.yml）：goal、goal-round-driver、ui-goal
          #   本 preset：/goal 人类命令 + 模型工具
          # 命令也挂在这一层的理由：host plane 的 command-goal 被 dsh-web-app 层禁用，
          # preset 不挂就没有任何一层注册 /goal；shipped 的 standard/ptc/cordis 预设
          # 同样在 preset 层注册它。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          # The goal SERVICE and its session driver stay on the host plane: the Gateway
          # serves the goal domain as Remote endpoints whose receiver comes from a
          # generated descriptor, so it resolves `goals` on the host and an entry-local
          # realm here would hide it. The registry is keyed by session anyway, so one host
          # instance serves every session. What a preset chooses is whether its agent can
          # call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # 压缩权归 billion-context（bili-native 的进程内 fetch 车道）：这里只关自动
              # 压缩，手动 /compact 与 ctx.compaction 服务保持可用（dev 的 laya-router 会调
              # ctx.compaction.compactIfNeeded）。必须写在预设里——profile 补丁打不到预设树，
              # billion-context 自带的 dsh.bundle.patch.yml 正是这样静默失效的。
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: false

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Product providers are host-plane singletons. Copy this preset, then
              # remove `disabled` from either ordinary tool row to expose that product
              # only to agents composed from the copy.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── self-modification ───────────────────────────────────────────────────────

          # Read the live runtime, mount a temporary plugin, unmount it. The toolset is a
          # trust boundary, not a sandbox — see this file's header.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

          # ── presentation ────────────────────────────────────────────────────────────

          # Code Mode beside the native catalog for this agent alone — PTC 模式's row,
          # widened from its `code` to `both` so neither form is traded away. The row
          # waits for the host's `codeRuntime` rather than assuming it: a deployment
          # that composes no TypeScript runtime fails this preset at mount, naming this
          # id, instead of at the first request.
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              # 2026-09-20 用户决策：只留一份。原 mode: both 让工具目录完整送两遍
              # （原生 schema 98,533 + Code Mode 的 ToolArgsMap/ToolOutputMap 69,017），
              # 占固定注入的 58%。实测 run_code 调用为 0。
              # 代价（源码 packages/core/tools/src/index.ts:906-911 确认）：run_code
              # transport 只呈现给「mode actually presents it」的 scope，native 下它从
              # 目录里消失，失去「5 次往返折叠成 1 次」的能力。
              mode: native

- insert:
    - id: preset-manager
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manager
        name: 管理模式
        description: Manager 编排模式：在全能模式之上注入 Manager 编排协议
          persona（读单→动态分类→派发→巡检→形式核验→失败重试一次→挂单上报→需终审停 waiting-check），并经 tools
          子路径行（dsh-task-manager/tools，ADR-0004）挂载 7 个任务工具（管理 5 + 队长 2）；队长会话为本预设的
          continuable 子会话，工具面由 per-child toolFilter 裁剪（docs/adr/0003）。2026-09-10
          实测：standingKeyFor('manager') 通过，7 个 task_* 工具在该预设作用域可见（当时代码经 dev
          worktree 部署——该 worktree 已于 2026-09-13 下线，现走工作区
          dsh-extensions/plugins/dsh-task-manager）。
        plugins:
          # The `omni` agent preset (全能模式): 标准模式 + PTC 模式 + 创造模式 combined
          # into one composition. Everything in `standard` is here unchanged; on top of
          # it this preset adds exactly what each other shipped mode contributes, and
          # nothing else:
          #
          # - From `code` (PTC 模式): the `tool-presentation` row — configured
          #   `mode: both` rather than PTC's `code`, so this agent sees every native
          #   schema AND `run_code` with the generated SDK, instead of trading one form
          #   away for the other.
          # - From `cordis` (创造模式): the persona paragraphs that teach the two-plane
          #   rule, the `tool-cordis` runtime-inspection toolset, and the two
          #   preset-traveling authoring skills (`editing-cordis-compositions`,
          #   `cordis-plugin-development`) via `skill-filesystem.customSkillDirs`.
          #
          # TRUST: the cordis toolset evaluates model-written JavaScript against the
          # live runtime, and a composition this agent writes becomes a preset other
          # sessions mount. Treat a session on this preset as shell access — the same
          # statement the `cordis` preset makes about itself.
          #
          # Adapted from the builtin `standard`, `code`, and `cordis` presets.
          #
          # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
          # standing scope; every session naming it joins by scope parentage, so the
          # tools and prompt sections registered here cover each joined agent while a
          # session's own state stays keyed per Session/Agent inside the plugins. The
          # host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global —
          # another preset publishing the same name collides, and a host reader would
          # resolve one preset's instance for every session; `dsh-agent-presets` rejects
          # that at mount. `true` means an entry-local realm: this standing mount's own
          # private instance, apart from every other preset's. (A shared label does NOT
          # pool instances — `provide()` throws on the second registration under the
          # same realm symbol; labels join REALMS, and are not what this file needs.)

          # ── identity ────────────────────────────────────────────────────────────────

          # Merged persona, kept deliberately lean: the standard coding-agent line, one
          # paragraph for the dual presentation (`mode: both`), and a skill-call index
          # that points agents to the on-demand skills below instead of inlining the
          # two-plane and plugin-authoring rules into every session's first prompt.
          # `{{model}}` resolves from the agent's own route; the working directory arrives
          # via the working-directory runtime-context snapshot, not a prompt variable.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness.

                Your tool catalog is presented twice: every tool keeps its native schema, and the same catalog is reachable as Code Mode — write one TypeScript program against the generated SDK and `run_code` executes its steps in order. Use plain single calls for one-step actions; fold chained steps (edit → run → read output → edit again) into one program when an intermediate result matters only to the next step.

                You can read and modify the harness you run on; its composition is Cordis. Never edit the shipped preset install — copy its composition and edit the copy. Harness details are NOT stored in this prompt; load the matching skill with the `skill` tool the moment a task enters its domain, and follow the skill's full instructions rather than its catalog summary:

                - `editing-cordis-compositions` — load BEFORE reading or changing any Cordis composition or agent preset: the two-plane rule (host vs preset), isolate realms for preset-owned services, mount-validation, preset authoring, and the shipped-preset rules all live there.
                - `cordis-plugin-development` — load BEFORE defining, running, updating, repairing, or removing a dynamic Cordis Plugin: Host/Client halves, Services and Events, Slots and Tools, approval and failure recovery.

                When a request touches harness composition or a dynamic Plugin at all, load the skill first instead of reconstructing its rules from memory.

                Code retrieval priority: to locate symbols, callers, call chains, architecture, complexity hotspots, or change impact in a codebase, query the codebase-memory MCP first (`mcp__cbm__search_graph`, `trace_path`, `get_architecture`, `search_code`); grep/glob are the fallback for literals, filenames, and raw counts. When the graph misses, verify coverage (`mcp__cbm__check_index_coverage` or `query_graph(graph="missed")`) before concluding "not found"; index unindexed repos with `mcp__cbm__index_repository` first. Detailed workflow: the `cbm-graph-first` skill.

                Manager 编排协议（管理模式专属）：本会话是 Manager，对任务清单持有唯一管理权；实际执行交给按类别创建的常驻队长子会话。闭环步骤：
                ① 读单：`task_list` 看清单（新单用 `task_create` 建单，需要用户终审的带 `needsFinalReview`）。
                ② 动态分类：按任务性质划定 category（如 research/implementation/review）——类别即队长单位，不预建空队长。
                ③ 派发：`task_assign(taskId, category, charter)` —— 新类别自动创建常驻队长子会话（首条消息=类别章程+任务简报），已有类别复用同一队长（派发轮次+1，状态转 in-progress）；章程必须写清该类别的产出纪律与证据要求。
                ④ 巡检：定期 `task_list` 检查在途单；滞留单用 `task_nudge` 催办并记录。
                ⑤ 形式核验：队长经 `task_report` 回报（状态+正文+证据路径）；三要素齐全且与任务目录相符才算通过——通过用 `task_set_status` 关 done；缺证据或不合格打回 problem，并写明缺什么。
                ⑥ 失败重试一次：problem 单对同类别重新 `task_assign` 一次（轮次+1）；再失败则挂单（保持 problem）并向用户上报，不得静默丢弃。
                ⑦ 需终审：needsFinalReview 单收到 done 回报会被数据层钳在 waiting-check——这是预期行为；向用户呈报结论，等用户显式终审（`task_set_status` 显式 done 或 GUI 改状态）后才算关单。
                状态语义（R4）：not-started → in-progress（已派发）→ waiting-reply / waiting-check（回报待核或需终审）→ done，异常走 problem。你的工具面含全部 7 个 task_* 工具；队长子会话继承本预设，但其工具面由 per-child toolFilter 收窄（仅保留 task_claim/task_report，deny 全部管理工具），回报身份由 taskManager 服务端校验——队长只能回报派发给自己的任务。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true # 2026-09-13 用户要求禁用自带 grep（改用 zvecgrep MCP full toolset）
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset,
          # PLUS the two authoring skills that travel with this preset directory (the
          # cordis preset's pattern): they document THIS deployment's two planes, and a
          # preset is the unit that gets copied and edited. `baseUrl` is the preset's
          # own directory, so the root resolves wherever the preset is installed. The
          # merged catalog also carries whatever the deployment registered globally
          # (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # 2026-09-25 用户要求：goal 相关插件全部启用。分工对齐 dsh-web-app bundle 的
          # 注释——服务与 session driver 留 host plane，人类命令与模型工具归 preset：
          #   host plane（profiles/web/cordis.patch.yml）：goal、goal-round-driver、ui-goal
          #   本 preset：/goal 人类命令 + 模型工具
          # 命令也挂在这一层的理由：host plane 的 command-goal 被 dsh-web-app 层禁用，
          # preset 不挂就没有任何一层注册 /goal；shipped 的 standard/ptc/cordis 预设
          # 同样在 preset 层注册它。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          # The goal SERVICE and its session driver stay on the host plane: the Gateway
          # serves the goal domain as Remote endpoints whose receiver comes from a
          # generated descriptor, so it resolves `goals` on the host and an entry-local
          # realm here would hide it. The registry is keyed by session anyway, so one host
          # instance serves every session. What a preset chooses is whether its agent can
          # call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # 压缩权归 billion-context（bili-native 的进程内 fetch 车道）：这里只关自动
              # 压缩，手动 /compact 与 ctx.compaction 服务保持可用。必须写在预设里——
              # profile 补丁打不到预设树，billion-context 自带的 dsh.bundle.patch.yml
              # 正是这样静默失效的。
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: false

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Product providers are host-plane singletons. Copy this preset, then
              # remove `disabled` from either ordinary tool row to expose that product
              # only to agents composed from the copy.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── self-modification ───────────────────────────────────────────────────────

          # Read the live runtime, mount a temporary plugin, unmount it. The toolset is a
          # trust boundary, not a sandbox — see this file's header.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

          # ── presentation ────────────────────────────────────────────────────────────

          # Code Mode beside the native catalog for this agent alone — PTC 模式's row,
          # widened from its `code` to `both` so neither form is traded away. The row
          # waits for the host's `codeRuntime` rather than assuming it: a deployment
          # that composes no TypeScript runtime fails this preset at mount, naming this
          # id, instead of at the first request.
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              # 2026-10-13（0.2.1）：schema 只接受 native|ptc，原 both 已非法。
              # 与 omni 的 2026-09-20 决策对齐：只留原生 schema，run_code 不进目录。
              mode: native

          # ── manager orchestration tools（M3，t13/t14 落地）──────────────────────────
          # The seven dsh-task-manager model tools (management ×5: task_assign/
          # task_create/task_set_status/task_list/task_nudge + captain ×2: task_claim/
          # task_report — names bound verbatim to MANAGEMENT_TOOL_NAMES in
          # orchestrator.ts) for this Manager session. The row references the tools-only
          # subpath entry (ADR-0004 双入口拆分, commit 1202cb0): it registers the tools
          # into this preset's layer of the shared tools registry and consumes the
          # HOST-provided taskManager service — tool-todo 同构消费者行，无 provide、无
          # 路由。Referencing the whole package here would re-provide taskManager and
          # collide with the host bundle row (t11 recorded: service "taskManager" has
          # been registered at <dsh-task-manager>). Captain children inherit these rows
          # and get the five management tools denied per-child by CAPTAIN_TOOL_FILTER;
          # the taskManager service itself stays host-plane (M0 结论 3-③).
          - id: tool-task-manager
            name: 'dsh-task-manager/tools'

- insert:
    - id: preset-simple
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: simple
        name: 简单模式
        description: 移除所有系统提示词与 skill 调用系统，仅保留持久 bash 与文件编辑的极简 Agent。
        order: 6
        plugins:
          # The `simple` agent preset (简单模式): a bare, prompt-free coding-agent composition.
          #
          # The single persona row is the ENTIRE system prompt. `complete: true` makes this
          # text the whole prompt, so global identity, Web orientation, AGENTS.md
          # (`dsh-agent-instructions`) and the skill index can never add prompt text. Its
          # text is empty, so there is NO system prompt at all. `includeRuntimeContext:
          # false` suppresses runtime-context snapshots.
          #
          # The skill-calling system is absent by design: no `dsh-skill-filesystem`, no
          # `dsh-tool-skill`. The agent only gets the persistent shell and a filesystem
          # editor. Context compaction is absent.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              complete: true
              includeRuntimeContext: false

          # The PTY registry is an agent-owned service, so it lives in an entry-local
          # realm. The backend still consumes the host sandbox policy and subprocess
          # implementation, while the tool registers into this agent's scoped catalog.
          # Exactly one shell stack mounts per host: the bash stack gates off win32 and
          # its pwsh twin gates off POSIX, mirroring the one-shot shell rows.
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'

              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000

              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * You do have access to a mirror of common linux and python packages via apt and pip.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect
                    * the current directory or workspace, first run the command "pwd" or "ls -la".

              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000

              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * You do have access to a mirror of common linux and python packages via apt and pip.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect
                    * the current directory or workspace, first run the command "pwd" or "ls".

          # Filesystem: consume the host `fs` service (its policy stays on the host), so a
          # second standalone mount never collides with an already-registered `fs`. Plus a
          # file-editing tool.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true # 2026-09-13 用户要求禁用自带 grep（改用 zvecgrep MCP full toolset）
            config:
              sampleOverCapGlobResults: false

          - id: str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'

# ── CoplayDev/unity-mcp（MCP for Unity v10.3.0）Windows 接入（2026-10-14）──────
# 两端：Unity 侧 UPM 包 com.coplaydev.unity-mcp（Packages/manifest.json 的 git 依赖，
# 钉 v10.3.0）；客户端走 stdio，由 uvx 拉 Python 服务端 mcpforunityserver==10.3.0
# （PyPI，与 UPM 包同版本，两端必须对齐），服务端再连 Unity 侧的反向桥 127.0.0.1:6400。
#
# Unity 侧起桥：包默认是 HTTP 模式，stdio 桥不会自启（AutoStartOnLoad /
# UseHttpTransport 都不是持久开关）。用包自带 CI 入口显式拉起：
#   Unity.exe -projectPath <proj> -executeMethod MCPForUnity.Editor.McpCiBoot.StartStdioForCi
# 起来后监听 6400，并写 %USERPROFILE%\.unity-mcp\unity-mcp-status-<hash>.json（reason:"ready"）。
#
# 与 Linux 部署的差异：本机没有全局 all_proxy/no_proxy，httpx 从注册表读到的只有
# Clash 的 127.0.0.1:7897 这条 HTTP 代理（无 socks → 不触发缺 socksio 的 ImportError，
# 也不存在 no_proxy 里 `[::1]` 的 InvalidURL），所以不需要 uvx-no-proxy 包装脚本；
# 直接用 uvx。命令写绝对路径，避免 dsh-web 进程的 PATH 里没有 scoop shims。
# 注意：uvx 默认走 PyPI（本机可达）。曾试过 UV_DEFAULT_INDEX=清华镜像，
# mcpforunityserver-10.3.0 的 wheel 在镜像上 403，别设该变量。
- insert:
    - id: mcp-unity
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: unity
        transport: stdio
        command: C:\Users\Admin\scoop\shims\uvx.exe
        args:
          - '--from'
          - 'mcpforunityserver==10.3.0'
          - 'mcp-for-unity'
          - '--transport'
          - 'stdio'
        # 编译、进播放模式这类调用超过默认 60s。
        toolCallTimeoutMs: 180000
        # Unity 编辑器没开时桥不通：不要让 MCP 连接失败拖垮整个会话启动。
        failOnStartupError: false

# ── 从 Linux profile 搬来（2026-10-18）：REA 逆向证据层 ────────────────────
# npm 包 rea-agents@6.4.0 全局装（rea.cmd 在 npm bin 目录）。引擎（Ghidra/JADX/
# apktool…）本机未装，对应 provider 会报 unavailable，属预期；装上引擎后无需改这里。
# toolCallTimeoutMs 放大到 600000：Ghidra 冷启动默认允许 330 s，客户端默认 60 s 会中途取消。
- insert:
    - id: mcp-rea
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        command: C:\Users\Admin\scoop\persist\nodejs-lts\bin\rea.cmd
        args:
          - mcp
        toolCallTimeoutMs: 600000
        failOnStartupError: false

# ── 从 Linux profile 搬来（2026-10-17）：工具按需加载 ───────────────────────
# 运行期用 plugin_manager 的 set_plugin 关/开整族 MCP（如 mcp-ue、mcp-unity），
# 不必改文件重启。代价：多 1 枚工具，每次调用需 danger-full-access 审批。
- id: tool-plugin-manager
  disabled: false

# ── 从 Linux profile 搬来（2026-10-18）：其余宿主配置 ───────────────────────
# 2026-10-18 曾整行禁用 ui-sidebar-right 来隐藏右侧面板，但 0.2.1 起 ui-chat /
# ui-sidebar-terminal / ui-sidebar-files / ui-reference / ui-deliverables /
# ui-schedule 等 10 个客户端插件都显式 inject sidebarRight / sidebarRightTabs；
# 禁用提供者会让它们全部 pending（web boot: 10 entries did not activate）。
# 与 Linux profile 对齐：不整行禁用，改用 panel: false —— 停掉面板与会话头展开
# 按钮两处挂载，服务照常提供，依赖插件不 pending。
- id: ui-sidebar-right
  config:
    panel: false

# 默认预设统一给 js（通用编码类型）；类型在新建会话时仍可切。
- id: agent-preset-registry
  config:
    default: js

- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: md
        model: deepseek-ai/DeepSeek-V4.1-Flash
      - provider: opencode-zen
        model: deepseek-v4.1-flash-free
      - provider: sensenova
        model: sensenova-6.8-flash-lite
      - provider: sensenova
        model: deepseek-flash

# ── 从 Linux profile 搬来（2026-10-18）：dsh-ops 组件开关 ────────────────────
# 上游就是 Windows 原生插件（自带 bash 5.3 / pwsh 7 载荷，已由 npm 平台包
# @dsh-ops/{fastctx,pwsh}-win32-x64 提供）。取舍同 Linux：file 组件关闭
# （ops_grep/ops_glob 与内建 grep/glob 重叠），background 与 ptc 启用。
- id: dsh-ops-file
  disabled: true
  config:
    promptPolicy: true
    enableShellTools: false
    required: false
    toolCallTimeoutMs: 300000
- id: dsh-ops-background
  disabled: false
  config:
    promptPolicy: true
    enableShellTools: true
    required: false
    toolCallTimeoutMs: 300000
- id: dsh-ops-ptc
  # PTC worker 运行时未落地：runtime/win32-x64 需要 Rust 构建（本机 cargo 镜像配置
  # 与仓库内 .cargo 配置冲突，provision 的 cargo build 直接失败）。Windows 侧预设
  # 用 native 呈现，PTC 本来不生效，故先关；要开就先解决 Rust 构建再设 false。
  disabled: true
  config:
    required: false

# <<< BEGIN generated type presets — 改 ~/.dsh/type-presets.yaml 或 ~/.dsh/preset-base.yml 后跑 ~/.dsh/bin/gen-project-presets.py >>>
- id: mcp-unity
  disabled: true
- id: mcp-ue
  disabled: true
- id: computer-use-cua-native
  disabled: true
- id: dsh-blender-plugin
  disabled: true
- id: browser-use-playwright
  disabled: true
- insert:
    - id: preset-js
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: js
        name: JS 项目
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness.
                You can read and modify the harness you run on; its composition is Cordis. Never edit the shipped preset install — copy its composition and edit the copy.
                Cordis rules are NOT stored in this prompt, and there is no skill carrying them. Before reading or changing a Cordis composition or an agent preset, or before defining, running, updating, repairing, or removing a dynamic Cordis Plugin, read the current rules directly rather than reconstructing them from memory: `docs/cordis-primer.md` and `docs/architecture.md` in the harness checkout, plus the shipped preset you are copying.
                Code retrieval priority: to locate symbols, callers, call chains, architecture, complexity hotspots, or change impact in a codebase, query the codebase-memory MCP first (`mcp__cbm__search_graph`, `trace_path`, `get_architecture`, `search_code`); grep/glob are the fallback for literals, filenames, and raw counts. When the graph misses, verify coverage (`mcp__cbm__check_index_coverage` or `query_graph(graph="missed")`) before concluding "not found"; index unindexed repos with `mcp__cbm__index_repository` first. Detailed workflow: the `cbm-graph-first` skill.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true # 2026-09-13 用户要求禁用自带 grep（改用 zvecgrep MCP 的检索）
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"
          - id: skill-filter
            name: '@deepseek-ai/dsh-skill-filter'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/',
                  baseUrl))"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            config:
              catalogDescriptionMaxLength: 150
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.
                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.
                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.
                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.
                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: false
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
