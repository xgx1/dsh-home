      # ── 用户要求（2026-10-15）：删掉 5.x 代旧模型，只留 6 代与 6.1 ──────────
      # 空对象与空列表都等于「服务 catalog 全量」（src/config.ts:105-110、
      # src/catalog.ts:864-866），所以减模型只能显式列出保留项：列出的替换整
      # 份 catalog，未列字段仍从 catalog 同 id 继承（src/catalog.ts:947-949）。
      # 代价：列表写死，pi-ai 以后上新模型不会自动出现。
      # 删：gpt-5.3-codex-spark、gpt-5.5、gpt-5.6-luna / -sol / -terra。
      openai-codex:
