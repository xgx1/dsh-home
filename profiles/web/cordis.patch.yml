# 已实测：该端点在直连下可用（返回 10 条结果 + 答案）。
# 注意：本覆盖会整份替换 base 的 web 配置，故 fetchProvider 必须一起写上。
# 要切回 Exa：先补 EXA_API_KEY，再加回 insert: web-search-exa 与其 searchProvider。
# 生效方式：改完必须重启 dsh-web（composition 在启动时装载，运行中不重读）。
