# <<< END generated type presets >>>

# ── ego-browser（2026-10-22 用户要求：装 dsh-ego-browser，网页访问优先 ego）──────
# 共享 profile 模式（2026-10-22 用户要求）：ego 不再用副本 profile，而是挂到用户**正在
# 运行的日常 Helium** 上——同一个进程、同一份 ~/.config/net.imput.helium。
#  · 前置：~/.config/helium-browser-flags.conf 里的 --remote-debugging-port=9222
#    （Helium 必须由 helium-wrapper/桌面图标启动才读这份 flags）。
#  · egoBin 指向本地 JS 包装：先探 9222，取到 webSocketDebuggerUrl 就设
#    EGO_LINUX_CDP_URL 直接挂载；挂不上才退回用 Helium profile 自起一份
#    （此时两者仍同一份数据，因为 EGO_LINUX_PROFILE 也指过去了）。
#  · idleTimeoutMin: 0 —— 共享模式下不能让插件的空闲回收去关用户自己的浏览器。
#  · chromePath/chromeArgs 只在「挂不上、需自起」时生效；Chrome 137+ 忽略
#    --load-extension，所以内核必须留 Helium。
- id: ego-browser
  config:
    egoBin: /home/sx/.local/share/ego-lite-runtime/bin/ego-shared.mjs
    idleTimeoutMin: 0
    chromePath: /opt/helium-browser-bin/helium
    chromeArgs: --load-extension=/usr/local/share/browser-themes/dracula
      --enable-features=VerticalTabs,VaapiVideoDecoder,VaapiIgnoreDriverChecks

# ── 2026-10-23 事故修复：重试预算收敛（覆盖 build 层 L1448 的 maxRetries: 1000）──
# 事故事实：c017f22b 13:02→15:20 重试 485 次仍未拿到一次回复；ChatGPT Plus 报
# 「try again in ~232 min」时本插件把 Retry-After 截到 60s 后继续重试，用户看到的是
# 「卡住」而不是「额度用完了」。
#  · maxRetries: 60 → 最坏 ≈ 4×5s + 15×10s + 41×60s ≈ 42 分钟就以错误结束该步，
#    错误对用户/模型可见，可以立刻换模型，而不是静默挂 8 小时。
#  · retryableCodes 去掉 QUOTA → 额度类失败交回官方 llm-retry（5 次、约 16 秒内失败），
#    不再用 60s 顶档去等一个 232 分钟的窗口。
#  · RATE_LIMIT 保留：sensenova 的 tpm/rps 抖动确实是秒级可恢复的。
- id: llm-retry-schedule
  config:
    maxRetries: 60
    retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
    schedule:
      - fromRetry: 1
        delayMs: 5000
      - fromRetry: 5
        delayMs: 10000
      - fromRetry: 20
        delayMs: 60000
