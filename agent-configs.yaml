# 技能 / MCP / 工具 的按项目选择。未列入此处的项目 = 空选择 = 不加载任何技能与 MCP，且一个工具都不允许。
# 依据 ~/.dsh/storages/workspace.json 的 24 个工作区 + 各自工程标记（*.uproject / ProjectSettings / *.sln|csproj / package.json）。
# selectionOf() 是精确字符串匹配：同一项目既有软链键又有真实路径键时，两套都要写。
# tools 是白名单 glob：一条都不匹配的工具被屏蔽；MCP 工具也可由其 server（mcp 字段）放行。
# /mnt/Video2/empty 故意不列：它是「什么都不给」的验证工作区。

