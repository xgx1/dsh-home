# DSH 技能过滤 · 个人层（$DSH_HOME/skill-filter.yaml，对所有项目生效）
#
# 语义（packages/skill/skill-filter/src/filter.ts）：两层取【并集】——项目层
# （<cwd>/.dsh/skill-filter.yaml）在个人层之上累加，任一层的 allow 即可见；
# 两层都不允许的技能既不进模型目录，也不能 /名称 调用、不注入上下文。
# 项目自己 .dsh/skills / .agents/skills 下的技能不受本管理器控制，始终生效。
#
# 本层放「任何项目都该有」的技能；域名技能走各自项目层：
#   UE 99 个      → unreal-* ue-* ue5-* + 9 个无前缀（各 UE 项目层）
#   Blazor/MAUI/rider/构建 → PsShowcaseWeb 项目层
#   rea 5 个      → dsh-extensions/skills/rea/.dsh/skill-filter.yaml
#   项目专属      → 各自项目层（yellowriver / XianXiaVS / HydroVault2 / blender）
#   本机运维      → ps-tool（modelscope）/ System（fcitx、OBS、归档、VS2022）
#
