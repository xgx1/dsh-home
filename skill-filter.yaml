# DSH 技能过滤（model catalog）
# 白名单制：仅列名技能对模型可见；未列名的仍可用 /name 手动调用。
# 2026-10-26 整肃：本 home 只服务「写代码」，只保留编码工作流必要的技能。
#   - persona：ponytail 四件套（常驻人格 + 审计/审查/极简优化）
